org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=true

# Coordinates of the published library: io.github.mradzinski:holler:<VERSION_NAME>
GROUP=io.github.mradzinski
POM_ARTIFACT_ID=holler
VERSION_NAME=1.0.0-rc01
POM_NAME=Holler
POM_DESCRIPTION=On-screen messages for Compose Multiplatform that look the same on Android, iOS, Desktop and Web.
POM_URL=https://github.com/mradzinski/holler
POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_SCM_URL=https://github.com/mradzinski/holler
POM_SCM_CONNECTION=scm:git:git://github.com/mradzinski/holler.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/mradzinski/holler.git
POM_DEVELOPER_ID=mradzinski
POM_DEVELOPER_NAME=mradzinski
POM_DEVELOPER_URL=https://github.com/mradzinski

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Where the Kotlin Multiplatform IDE plugin finds the iOS sample's Xcode project. It looks for an
# "iosApp" folder at the project root by default; ours lives with the other samples.
xcodeproj=./sample/iosApp

# Roborazzi (Android screenshot tests of the library): a picture named in a test is kept in the folder the
# build script sets (holler/src/androidHostTest/screenshots), not next to where the test happens to run.
roborazzi.record.filePathStrategy=relativePathFromRoborazziContextOutputDirectory
# The pictures are compared by `./gradlew :holler:verifyRoborazziAndroidHostTest`, which `publishLibrary` runs
# before it publishes. A plain build or test run does not compare them. Record new pictures with
# `./gradlew :holler:recordRoborazziAndroidHostTest`.
