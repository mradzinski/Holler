# Builds the library and the sample, runs every test and lint, and sends the coverage of the library to
# Codecov. The "build" and "coverage" badges at the top of the README read the results of this workflow.
name: build

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the run of the older one pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # macOS, because the iOS tests need Xcode and a simulator. It also has Chrome, for the browser tests.
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # The same Java release the project is built with locally.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Everything `./gradlew build` covers: every target compiled, the tests on desktop, Android
      # (Robolectric), the iOS simulator and the browser, ktlint, detekt and the coverage limit.
      - name: Build and test
        run: ./gradlew build :holler:koverXmlReport

      - name: Send the coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: holler/build/reports/kover/report.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      # When a test fails, its report says which one and why.
      - name: Keep the test reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            holler/build/outputs/roborazzi/
