# Settings of the Android that Robolectric gives the tests which draw a message.

# The Android release the tests run on: the one the library is compiled against.
sdk=37

# Draws with Android's own graphics code, so a test can read the pixels of what was drawn.
graphicsMode=NATIVE

# The screen. Robolectric's own default is 320 x 470 dp, narrower than a message at its full width (375 dp).
# This is the size Compose's desktop tests use, so the same test sees the same room on both.
qualifiers=w1024dp-h768dp-mdpi
