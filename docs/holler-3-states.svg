<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1501px;height:685px;background:#FFFFFF;" width="1501px" height="685px" viewBox="0 0 1501 685" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="596.808" y="23.535" fill="#000" font-size="14" textLength="300.658" font-weight="700">The two state machines inside a message</text></g><g class="entity" data-qualified-name="stages" id="ent0001" data-source-line="5"><path d="M19.5,44.488 L674.498,44.488 A12.5,12.5 0 0 1 686.998,56.988 L686.998,70.977 L7,70.977 L7,56.988 A12.5,12.5 0 0 1 19.5,44.488" fill="#F1F1F1"/><rect x="7" y="44.488" width="679.998" height="509.908" fill="none" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="7" y1="70.977" x2="686.998" y2="70.977" style="stroke:#181818;stroke-width:0.5;"/><text x="192.609" y="63.023" fill="#000" font-size="14" textLength="308.779">The message in the queue (HollerEntry.Stage)</text><g class="entity" data-qualified-name="stages.Queued" id="ent0002" data-source-line="7"><rect x="171.5" y="154.977" width="258.369" height="52.977" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="171.5" y1="181.465" x2="429.869" y2="181.465" style="stroke:#181818;stroke-width:0.5;"/><text x="274.353" y="173.512" fill="#000" font-size="14" textLength="52.664">Queued</text><text x="176.5" y="200" fill="#000" font-size="14" textLength="238.369">shown by your code, not drawn yet</text></g><g class="entity" data-qualified-name="stages.Visible" id="ent0003" data-source-line="9"><rect x="19" y="275.957" width="251.369" height="52.977" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="19" y1="302.445" x2="270.369" y2="302.445" style="stroke:#181818;stroke-width:0.5;"/><