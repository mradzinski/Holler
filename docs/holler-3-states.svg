ength="158.025">dismissed for any reason</text></g><!--link Queued to *end*stages--><g class="link" data-entity-1="ent0002" data-entity-2="ent0015" id="lnk16" data-source-line="13" data-link-type="dependency"><path d="M425.56,208.317 C432.43,213.247 438.59,219.077 443.68,225.957 C516.57,324.307 512.06,399.857 443.68,501.397 C430.69,520.697 406.816,526.115 390.846,527.985" style="stroke:#181818;stroke-width:1;" fill="none" id="Queued-to-*end*stages"/><polygon points="385.88,528.567,395.284,531.493,390.846,527.985,394.354,523.547,385.88,528.567" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="497.67" y="360.505" fill="#000" font-size="13" textLength="164.328">dismissed or left undrawn</text><text x="523.076" y="375.815" fill="#000" font-size="13" textLength="113.515">(removed at once)</text></g><!--link Leaving to *end*stages--><g class="link" data-entity-1="ent0004" data-entity-2="ent0015" id="lnk17" data-source-line="14" data-link-type="dependency"><path d="M290.15,466.807 C293.88,478.927 299.68,491.907 308.68,501.397 C323.76,517.287 344.403,523.556 358.893,526.546" style="stroke:#181818;stroke-width:1;" fill="none" id="Leaving-to-*end*stages"/><polygon points="363.79,527.557,355.784,521.82,358.893,526.546,354.167,529.655,363.79,527.557" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="309.68" y="497.965" fill="#000" font-size="13" textLength="133.974">exit animation ended</text></g></g><g class="entity" data-qualified-name="phases" id="ent0005" data-source-line="17"><path d="M734.23,104.978 L1473.774,104.978 A12.5,12.5 0 0 1 1486.274,117.478 L1486.274,131.467 L721.73,131.467 L721.73,117.478 A12.5,12.5 0 0 1 734.23,104.978" fill="#F1F1F1"/><rect x="721.73" y="104.978" width="764.544" height="388.928" fill="none" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="721.73" y1="131.467" x2="1486.274" y2="131.467" style="stroke:#181818;stroke-width:0.5;"/><text x="987.415" y="123.513" fill="#000" font-size="14" textLength="233.174">Its countdown (HollerTimer.Phase)</text><g class="entity" data-qualified-name="phases.Counting" id="ent0006" data-source-line="19"><rect x="970.65" y="215.467" width="122.478" height="52.977" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="970.65" y1="241.955" x2="1093.128" y2="241.955" style="stroke:#181818;stroke-width:0.5;"/><text x="1000.707" y="234.002" fill="#000" font-size="14" textLength="62.364">Counting</text><text x="975.65" y="260.49" fill="#000" font-size="14" textLength="102.478">time is passing</text></g><g class="entity" data-qualified-name="phases.Paused" id="ent0007" data-source-line="21"><rect x="733.73" y="344.687" width="146.308" height="52.977" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="733.73" y1="371.175" x2="880.038" y2="371.175" style="stroke:#181818;stroke-width:0.5;"/><text x="782.931" y="363.222" fill="#000" font-size="14" textLength="47.906">Paused</text><text x="738.73" y="389.71" fill="#000" font-size="14" textLength="126.308">held for a moment</text></g><g class="entity" data-qualified-name="phases.Stopped" id="ent0008" data-source-line="24"><rect x="903.93" y="336.447" width="303.903" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="903.93" y1="362.935" x2="1207.833" y2="362.935" style="stroke:#181818;stroke-width:0.5;"/><text x="1028.076" y="354.982" fill="#000" font-size="14" textLength="55.61">Stopped</text><text x="908.93" y="381.47" fill="#000" font-size="14" textLength="122.117">stays until closed;</text><text x="908.93" y="397.958" fill="#000" font-size="14" textLength="283.903">bar, countdown and stop button are gone</text></g><g class="entity" data-qualified-name="phases.Finished" id="ent0009" data-source-line="26"><rect x="1225.5" y="336.447" width="236.774" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="1225.5" y1="362.935" x2="1462.274" y2="362.935" style="stroke:#181818;stroke-width:0.5;"/><text x="1315.525" y="354.982" fill="#000" font-size="14" textLength="56.725">Finished</text><text x="1230.5" y="381.47" fill="#000" font-size="14" textLength="114.194">reports Timeout,</text><text x="1230.5" y="397.958" fill="#000" font-size="14" textLength="216.774">which makes the message leave</text></g><g class="start_entity" data-qualified-name="phases..start.phases" id="ent0018" data-source-line="18"><ellipse cx="1031.88" cy="152.467" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name="phases..end.phases" id="ent0024" data-source-line="27"><ellipse cx="1198.88" cy="469.907" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="1198.88" cy="469.907" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><!--link *start*phases to Counting--><g class="link" data-entity-1="ent0018" data-entity-2="ent0006" id="lnk19" data-source-line="18" data-link-type="dependency"><path d="M1031.88,162.827 C1031.88,175.167 1031.88,192.377 1031.88,209.967" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*phases-to-Counting"/><polygon points="1031.88,214.967,1035.88,205.967,1031.88,209.967,1027.88,205.967,1031.88,214.967" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1032.88" y="194.035" fill="#000" font-size="13" textLength="105.65">the card appears</text></g><!--link Counting to Paused--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" id="lnk20" data-source-line="20" data-link-type="dependency"><path d="M970.25,245.637 C907.9,249.787 817.68,260.267 795.88,286.447 C782.66,302.327 785.572,321.44 792.442,339.61" style="stroke:#181818;stroke-width:1;" fill="none" id="Counting-to-Paused"/><polygon points="794.21,344.287,794.769,334.454,792.442,